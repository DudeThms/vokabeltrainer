      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 30px;

      width: 100%;
      max-width: 460px;
      text-align: center;

      color: #1e293b;
    }
    .setup-section {
      margin-bottom: 20px;
      text-align: left;
    }
    .setup-section label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .name-buttons {
      display: flex;
      gap: 10px;
    }
    .name-btn {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .name-btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }
    select {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: #f8fafc;
      color: #0f172a;
      font-weight: 500;
      cursor: pointer;
    }
    .start-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .start-btn:hover { background-color: #1d4ed8; }

    .profile-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;

      font-size: 12px;

      gap: 8px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 8px;
      margin-bottom: 18px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: #64748b;

      color: #0f172a;

      color: #0f172a;

      border: 1px solid #cbd5e1;
      border-radius: 6px;

      font-size: 16px;

      color: white;
      background-color: #2563eb;
      border: none;

<div class="card">
  <!-- 1. HAUPT-AUSWAHLBILDSCHIRM (Startseite) -->
  <div id="setup-screen">
    <h1>Vokabel-Trainer 📚</h1>
    
    <div class="setup-section">
      <label>Wer bist du?</label>
      <div class="name-buttons">
        <button type="button" id="name-karla" class="name-btn active" onclick="selectName('Karla')">Karla</button>
        <button type="button" id="name-moritz" class="name-btn" onclick="selectName('Moritz')">Moritz</button>
      </div>
    </div>

    <div class="setup-section">
      <label for="subject-select">Fach auswählen:</label>
      <select id="subject-select" onchange="toggleUnitFilter()">
        <option value="english">Englisch (Green Line 1)</option>
        <option value="latin">Latein</option>
      </select>
    </div>

    <div class="setup-section" id="unit-filter-container">
      <label for="unit-select">Lernbereich / Unit:</label>
      <select id="unit-select">
        <option value="single_0">Nur Pick-up A</option>
        <option value="single_1">Nur Unit 1 – Check-in</option>
        <option value="single_2">Nur Unit 1 – Station 1</option>
        <option value="single_3">Nur Unit 1 – Station 2</option>
        <option value="single_4">Nur Unit 1 – Story & Check-out</option>
        <option value="upto_4" selected>Komplettes Buch (PU A bis Unit 1 Ende)</option>
      </select>
    </div>

    <button class="start-btn" onclick="openProfilePage()">Zu meiner Lernseite 🚀</button>
  </div>

  <!-- 2. PERSONALISIERTE UNTERSEITE (FÜR KARLA ODER MORITZ) -->
  <div id="quiz-screen" class="hidden">
    
    <div class="profile-header">
      <div>
        <h2 id="profile-title">Profil</h2>
        <span id="profile-subtitle" style="font-size: 12px; opacity: 0.9;">Fach</span>
      </div>
      <button class="back-btn" onclick="backToSetup()">⬅️ Zur Auswahl</button>
    </div>

    <div class="mode-switch">
      <button id="btn-mode-type" class="mode-btn active" onclick="setMode('type')">✍️ Eingabe</button>
      <button id="btn-mode-mc" class="mode-btn" onclick="setMode('mc')">🔘 Multiple Choice</button>
    </div>
    
    <div id="quiz-area">
      <p id="progress" style="color: #64748b; font-size: 13px; margin: 0;"></p>
      <div class="word-box">
        <span id="lang-label" class="lang-badge lang-en">Englisch</span>
        <h2 id="prompt-word"></h2>
      </div>

      <div id="type-area">
        <input type="text" id="answer-input" placeholder="Übersetzung eingeben..." autocomplete="off">
        <button id="check-btn" class="action-btn" onclick="checkTypedAnswer()">Prüfen</button>
      </div>

      <div id="mc-area" class="mc-options hidden"></div>

      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="action-btn btn-next hidden" onclick="nextWord()">Nächste Vokabel</button>
    </div>

    <div id="result-area" class="hidden">
      <h2>Super gemacht! 🏆</h2>
      <p id="score-text" style="font-size: 18px; margin: 20px 0;"></p>
      <button class="action-btn" onclick="startQuiz()">Nochmal lernen</button>
    </div>
  </div>
</div>

  // Latein Vokabeln (Beispiel-Set)
  const latinVocab = [
    { level: 0, english: "salve", german: "hallo, sei gegrüßt" },
    { level: 0, english: "amicus", german: "Freund" },
    { level: 0, english: "puella", german: "Mädchen" },
    { level: 0, english: "laborare", german: "arbeiten" },
    { level: 0, english: "terra", german: "Erde, Land" },
    { level: 0, english: "magister", german: "Lehrer" },
    { level: 0, english: "schola", german: "Schule" },
    { level: 0, english: "liber", german: "Buch" }
  ];

  let activeVocabList = [];
  let currentMode = 'type';
  let currentIndex = 0;
  let score = 0;
  let isEnToDe = true;

  function selectName(name) {
    selectedName = name;
    document.getElementById('name-karla').classList.toggle('active', name === 'Karla');
    document.getElementById('name-moritz').classList.toggle('active', name === 'Moritz');
  }

  function toggleUnitFilter() {
    currentSubject = document.getElementById('subject-select').value;
    const unitContainer = document.getElementById('unit-filter-container');
    const unitSelect = document.getElementById('unit-select');

    if (currentSubject === 'latin') {
      unitContainer.classList.add('hidden');
    } else {
      unitContainer.classList.remove('hidden');
      unitSelect.innerHTML = `
        <option value="single_0">Nur Pick-up A</option>
        <option value="single_1">Nur Unit 1 – Check-in</option>
        <option value="single_2">Nur Unit 1 – Station 1</option>
        <option value="single_3">Nur Unit 1 – Station 2</option>
        <option value="single_4">Nur Unit 1 – Story & Check-out</option>
        <option value="upto_4" selected>Komplettes Buch (PU A bis Unit 1 Ende)</option>
      `;
    }
  }

  function openProfilePage() {
    currentSubject = document.getElementById('subject-select').value;
    
    if (currentSubject === 'latin') {
      activeVocabList = [...latinVocab];
    } else {
      const selection = document.getElementById('unit-select').value;
      const [type, levelStr] = selection.split('_');
      const targetLevel = parseInt(levelStr, 10);

      if (type === 'single') {
        activeVocabList = englishVocab.filter(v => v.level === targetLevel);
      } else {
        activeVocabList = englishVocab.filter(v => v.level <= targetLevel);
      }
    }

    if (activeVocabList.length === 0) {
      alert("Für diesen Bereich sind aktuell keine Vokabeln vorhanden.");
      return;
    }

    activeVocabList.sort(() => Math.random() - 0.5);

    // Ansicht zur personalisierten Unterseite umschalten
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    
    document.getElementById('profile-title').textContent = `${selectedName}'s Lernbereich`;
    document.getElementById('profile-subtitle').textContent = currentSubject === 'latin' ? 'Fach: Latein' : 'Fach: Englisch (Green Line 1)';

    restartQuiz();
  }

  function backToSetup() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-mode-type').classList.toggle('active', mode === 'type');
    document.getElementById('btn-mode-mc').classList.toggle('active', mode === 'mc');
    restartQuiz();
  }

  function loadWord() {
    const current = activeVocabList[currentIndex];
    document.getElementById('progress').textContent = `Frage ${currentIndex + 1} von ${activeVocabList.length}`;
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn').classList.add('hidden');

    isEnToDe = Math.random() < 0.5;

    const questionText = isEnToDe ? current.english : current.german;
    const expectedAnswer = isEnToDe ? current.german : current.english;

    const langLabelEl = document.getElementById('lang-label');
    const inputEl = document.getElementById('answer-input');

    if (isEnToDe) {
      langLabelEl.textContent = currentSubject === 'latin' ? 'Latein' : 'Englisch';
      langLabelEl.className = 'lang-badge lang-en';
      inputEl.placeholder = 'Deutsche Übersetzung...';
    } else {
      langLabelEl.textContent = 'Deutsch';
      langLabelEl.className = 'lang-badge lang-de';
      inputEl.placeholder = currentSubject === 'latin' ? 'Lateinische Übersetzung...' : 'Englische Übersetzung...';
    }

    document.getElementById('prompt-word').textContent = questionText;

    if (currentMode === 'type') {
      document.getElementById('type-area').classList.remove('hidden');
      document.getElementById('mc-area').classList.add('hidden');
      inputEl.value = '';
      inputEl.disabled = false;
      document.getElementById('check-btn').classList.remove('hidden');
      inputEl.focus();
    } else {
      document.getElementById('type-area').classList.add('hidden');
      document.getElementById('mc-area').classList.remove('hidden');
      generateMultipleChoice(expectedAnswer);
    }
  }

  function generateMultipleChoice(correctAnswer) {
    const mcArea = document.getElementById('mc-area');
    mcArea.innerHTML = '';
    
    const pool = currentSubject === 'latin' ? latinVocab : englishVocab;
    const wrongOptions = pool
      .map(item => isEnToDe ? item.german : item.english)
      .filter(word => word !== correctAnswer);
    
    const uniqueWrong = [...new Set(wrongOptions)];
    uniqueWrong.sort(() => Math.random() - 0.5);
    
    const selectedOptions = [correctAnswer, ...uniqueWrong.slice(0, 2)];
    selectedOptions.sort(() => Math.random() - 0.5);

    selectedOptions.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'mc-btn';
      btn.textContent = option;
      btn.onclick = () => checkMcAnswer(btn, option, correctAnswer);
      mcArea.appendChild(btn);
    });
  }

  function checkMcAnswer(clickedBtn, selectedOption, correctAnswer) {
    const mcArea = document.getElementById('mc-area');
    const allButtons = mcArea.querySelectorAll('.mc-btn');
    allButtons.forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === correctAnswer) {
        btn.classList.add('correct');
      }
    });

    const feedbackEl = document.getElementById('feedback');
    if (selectedOption === correctAnswer) {
      feedbackEl.textContent = 'Richtig! 🎉';
      feedbackEl.style.color = '#10b981';
      score++;
    } else {
      clickedBtn.classList.add('wrong');
      feedbackEl.textContent = `Falsch! Richtig ist: "${correctAnswer}"`;
      feedbackEl.style.color = '#ef4444';
    }

    document.getElementById('next-btn').classList.remove('hidden');
  }

  function checkTypedAnswer() {
    const inputEl = document.getElementById('answer-input');
    const userAnswer = inputEl.value.trim().toLowerCase();
    const originalCorrect = isEnToDe ? activeVocabList[currentIndex].german : activeVocabList[currentIndex].english;
    const correctAnswerLower = originalCorrect.toLowerCase();
    
    if (userAnswer === '') return;

    inputEl.disabled = true;
    document.getElementById('check-btn').classList.add('hidden');
    document.getElementById('next-btn').classList.remove('hidden');

    const possibleAnswers = correctAnswerLower.split(/[,/]/).map(s => s.trim());
    const isCorrect = userAnswer === correctAnswerLower || possibleAnswers.includes(userAnswer);

    const feedbackEl = document.getElementById('feedback');
    if (isCorrect) {
      feedbackEl.textContent = 'Richtig! 🎉';
      feedbackEl.style.color = '#10b981';
      score++;
    } else {
      feedbackEl.textContent = `Falsch! Richtig wäre: "${originalCorrect}"`;
      feedbackEl.style.color = '#ef4444';
    }
  }

  function nextWord() {
    currentIndex++;
    if (currentIndex < activeVocabList.length) {
      loadWord();
    } else {
      document.getElementById('quiz-area').classList.add('hidden');
      document.getElementById('result-area').classList.remove('hidden');
      document.getElementById('score-text').textContent = `${selectedName}, du hast ${score} von ${activeVocabList.length} Vokabeln richtig gewusst!`;
    }
  }

  function startQuiz() {
    currentIndex = 0;
    score = 0;
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    loadWord();
  }

  document.getElementById('answer-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && currentMode === 'type' && !document.getElementById('check-btn').classList.contains('hidden')) {
      checkTypedAnswer();
    }
  });
</script>
