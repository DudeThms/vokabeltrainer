      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #475569;
    }
    .credits {
      color: #e11d48;
      background: #ffe4e6;

      border-radius: 20px;

    .filter-box {
      margin-bottom: 20px;
      text-align: left;
    }

      font-size: 12px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    select {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: #f8fafc;
      color: #0f172a;
      font-weight: 500;
      cursor: pointer;
    }
    .word-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      margin: 12px 0 18px 0;
    }
    .lang-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.8px;
    }
    .lang-en { background-color: #dbeafe; color: #1e40af; }
    .lang-de { background-color: #fef3c7; color: #92400e; }
    .word-box h2 {
      margin: 12px 0 0 0;
      font-size: 20px;
      color: #0f172a;
      word-wrap: break-word;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .action-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .action-btn:hover { background-color: #1d4ed8; }
    .btn-next { background-color: #10b981; margin-top: 10px; }
    .btn-next:hover { background-color: #059669; }
    
    .mc-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mc-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      background-color: #f8fafc;
      color: #0f172a;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      text-align: left;
      padding-left: 15px;
      transition: all 0.15s;
    }
    .mc-btn:hover:not(:disabled) {
      border-color: #2563eb;
      background-color: #eff6ff;
    }
    .mc-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; font-weight: bold; }
    .mc-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }

    .feedback {
      margin-top: 15px;
      font-weight: bold;
      font-size: 15px;
      min-height: 22px;

  </div>
  
  <div id="quiz-area">

    </div>

    <div class="word-box">

      <h2 id="prompt-word"></h2>
    </div>

    <div id="type-area">
      <input type="text" id="answer-input" placeholder="Übersetzung eingeben..." autocomplete="off">
      <button id="check-btn" class="action-btn" onclick="checkTypedAnswer()">Prüfen</button>
    </div>

    <div id="mc-area" class="mc-options hidden"></div>

    <p id="feedback" class="feedback"></p>
    <button id="next-btn" class="action-btn btn-next hidden" onclick="nextWord()">Nächste Vokabel</button>
  </div>

  <div id="result-area" class="hidden">
    <h2 id="result-title">Geschafft! 🏆</h2>
    <p id="score-text" style="font-size: 18px; margin: 20px 0;"></p>

</div>

    { level: 4, english: "fantasy", german: "Fantasie, Traum-" }
  ];

  let activeVocabList = [];
  let currentIndex = 0;
  let score = 0;
  let credits = 4;
  let isDeToEn = true;
  let isMcMode = false;

  const unitSelect = document.getElementById('unit-select');
  const progressEl = document.getElementById('progress');
  const creditsDisplay = document.getElementById('credits-display');
  const langLabelEl = document.getElementById('lang-label');
  const promptWordEl = document.getElementById('prompt-word');
  const typeArea = document.getElementById('type-area');
  const mcArea = document.getElementById('mc-area');
  const inputEl = document.getElementById('answer-input');
  const checkBtn = document.getElementById('check-btn');
  const nextBtn = document.getElementById('next-btn');
  const feedbackEl = document.getElementById('feedback');

  function isSentence(text) {
    return text.includes(' ') || text.includes('.') || text.includes('!') || text.includes('?');
  }

  function isSimpleSingleWord(vocabItem) {
    const en = vocabItem.english.trim();
    const de = vocabItem.german.trim();
    if (/[.!?(]/.test(en) || /[.!?(]/.test(de)) return false;
    if (en.includes(' ') || en.includes('/')) return false;
    return true;
  }

  function getValidMeanings(answerText) {
    const parts = answerText.split(/[,;]/).map(s => s.trim()).filter(Boolean);
    const meanings = new Set();

    parts.forEach(part => {
      const lower = part.toLowerCase();
      meanings.add(lower);

      if (lower.includes('/')) {
        const slashParts = lower.split('/');
        if (slashParts.length === 2) {
          const base = slashParts[0].trim();
          const suffix = slashParts[1].trim();
          if (suffix.length <= 3) {
            meanings.add(base);
            meanings.add(base + suffix);
          } else {
            meanings.add(base);
            meanings.add(suffix);
          }
        }
      }
    });

    return Array.from(meanings);
  }

  function getEditDistance(a, b) {
    const m = a.length;
    const n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));

    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;

    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + cost
        );
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
          dp[i][j] = Math.min(dp[i][j], dp[i - 2][j - 2] + 1);
        }
      }
    }
    return dp[m][n];
  }

  function updateVocabPool() {
    const selection = unitSelect.value;
    const [type, levelStr] = selection.split('_');
    const targetLevel = parseInt(levelStr, 10);

    let pool = [];
    if (type === 'single') {
      pool = allVocab.filter(v => v.level === targetLevel);
    } else {
      pool = allVocab.filter(v => v.level <= targetLevel);
    }

    pool.sort(() => Math.random() - 0.5);
    activeVocabList = pool.slice(0, 25);

    restartQuiz();
  }

  function restartQuiz() {
    currentIndex = 0;
    score = 0;
    credits = 4;
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    updateCreditsDisplay();
    loadWord();
  }

  function updateCreditsDisplay() {
    creditsDisplay.textContent = `❤️ Credits: ${credits}`;
  }

  function loadWord() {
    if (credits <= 0) {
      endGame(false);
      return;
    }

    const current = activeVocabList[currentIndex];
    progressEl.textContent = `Frage ${currentIndex + 1} von ${activeVocabList.length}`;
    feedbackEl.textContent = '';
    nextBtn.classList.add('hidden');

    isDeToEn = Math.random() < 0.6;
    
    // Nur noch 10% Chance für Multiple Choice bei einfachen Wörtern (Sätze weiterhin immer MC)
    if (isSimpleSingleWord(current)) {
      isMcMode = Math.random() < 0.10; 
    } else {
      isMcMode = true;
    }

    const questionText = isDeToEn ? current.german : current.english;
    const expectedAnswer = isDeToEn ? current.english : current.german;

    if (isDeToEn) {
      langLabelEl.textContent = 'Deutsch';
      langLabelEl.className = 'lang-badge lang-de';
      inputEl.placeholder = 'Englische Übersetzung...';
    } else {
      langLabelEl.textContent = 'Englisch';
      langLabelEl.className = 'lang-badge lang-en';
      inputEl.placeholder = 'Deutsche Übersetzung...';
    }

    promptWordEl.textContent = questionText;

    if (!isMcMode) {
      typeArea.classList.remove('hidden');
      mcArea.classList.add('hidden');
      inputEl.value = '';
      inputEl.disabled = false;
      checkBtn.classList.remove('hidden');
      inputEl.focus();
    } else {
      typeArea.classList.add('hidden');
      mcArea.classList.remove('hidden');
      generateMultipleChoice(expectedAnswer);
    }
  }

  function generateMultipleChoice(correctAnswer) {
    mcArea.innerHTML = '';
    
    const targetIsSentence = isSentence(correctAnswer);

    const wrongOptions = allVocab
      .map(item => isDeToEn ? item.english : item.german)
      .filter(word => word !== correctAnswer && isSentence(word) === targetIsSentence);
    
    const poolToUse = wrongOptions.length >= 2
      ? [...new Set(wrongOptions)]
      : [...new Set(allVocab.map(item => isDeToEn ? item.english : item.german).filter(w => w !== correctAnswer && isSentence(w) === targetIsSentence))];

    poolToUse.sort(() => Math.random() - 0.5);
    
    const selectedOptions = [correctAnswer, ...poolToUse.slice(0, 2)];
    selectedOptions.sort(() => Math.random() - 0.5);

    selectedOptions.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'mc-btn';
      btn.textContent = option;
      btn.onclick = () => checkMcAnswer(btn, option, correctAnswer);
      mcArea.appendChild(btn);
    });
  }

  function checkMcAnswer(clickedBtn, selectedOption, correctAnswer) {
    const allButtons = mcArea.querySelectorAll('.mc-btn');
    allButtons.forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === correctAnswer) {
        btn.classList.add('correct');
      }
    });

    if (selectedOption === correctAnswer) {
      feedbackEl.textContent = 'Richtig! 🎉';
      feedbackEl.style.color = '#10b981';
      score++;
    } else {
      clickedBtn.classList.add('wrong');
      credits--;
      updateCreditsDisplay();
      feedbackEl.textContent = `Falsch! Richtig ist: "${correctAnswer}"`;
      feedbackEl.style.color = '#ef4444';
    }

    if (credits <= 0) {
      setTimeout(() => endGame(false), 1500);
    } else {
      nextBtn.classList.remove('hidden');
    }
  }

  function checkTypedAnswer() {
    const userAnswer = inputEl.value.trim().toLowerCase();
    const originalCorrect = isDeToEn ? activeVocabList[currentIndex].english : activeVocabList[currentIndex].german;
    
    if (userAnswer === '') return;

    inputEl.disabled = true;
    checkBtn.classList.add('hidden');

    const validMeanings = getValidMeanings(originalCorrect);
    const isExactMatch = validMeanings.includes(userAnswer);

    let isNearMatch = false;
    if (!isExactMatch && userAnswer.length >= 2) {
      isNearMatch = validMeanings.some(meaning => meaning.length >= 3 && getEditDistance(userAnswer, meaning) === 1);
    }

    if (isExactMatch) {
      feedbackEl.textContent = 'Richtig! 🎉';
      feedbackEl.style.color = '#10b981';
      score++;
      nextBtn.classList.remove('hidden');
    } else if (isNearMatch) {
      feedbackEl.textContent = `Fast richtig! ✍️ (Richtig: "${originalCorrect}")`;
      feedbackEl.style.color = '#d97706';
      score++;
      nextBtn.classList.remove('hidden');
    } else {
      credits--;
      updateCreditsDisplay();
      feedbackEl.textContent = `Falsch! Richtig wäre: "${originalCorrect}"`;
      feedbackEl.style.color = '#ef4444';
      
      if (credits <= 0) {
        setTimeout(() => endGame(false), 1500);
      } else {
        nextBtn.classList.remove('hidden');
      }
    }
  }

  function nextWord() {
    currentIndex++;
    if (currentIndex < activeVocabList.length) {
      loadWord();
    } else {
      endGame(true);
    }
  }

  function endGame(success) {
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('result-area').classList.remove('hidden');
    
    const titleEl = document.getElementById('result-title');
    const scoreTextEl = document.getElementById('score-text');

    if (success) {
      titleEl.textContent = "Geschafft! 🏆";
      scoreTextEl.textContent = `Super! Du hast ${score} von ${activeVocabList.length} Vokabeln richtig geschafft und noch ${credits} Credit(s) übrig!`;
    } else {
      titleEl.textContent = "Game Over ❌";
      scoreTextEl.textContent = `Keine Credits mehr übrig! Du bist bei Frage ${currentIndex + 1} ausgeschieden. Versuch es noch einmal!`;
    }
  }

  inputEl.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !isMcMode && !checkBtn.classList.contains('hidden')) {
      checkTypedAnswer();
    }
  });

  updateVocabPool();
</script>
